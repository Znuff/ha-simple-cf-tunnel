name: Simple Cloudflare Tunnel
version: "0.3.0"
slug: simple_cf_tunnel
description: >-
  Reach Home Assistant through Cloudflare: your own hostname,
  or a temporary trycloudflare.com URL. No open ports.
url: https://github.com/Znuff/ha-simple-cf-tunnel
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-lock-outline
panel_title: Cloudflare Tunnel
