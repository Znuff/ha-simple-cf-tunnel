name: Build add-on images

on:
  push:
    branches: [main]
    paths:
      - "simple_cf_tunnel/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Read add-on version
        id: version
        run: echo "version=$(yq -r .version simple_cf_tunnel/config.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name must match `image:` in config.yaml, where HA fills in {arch}.
      - uses: docker/build-push-action@v7
        with:
          context: simple_cf_tunnel
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/znuff/${{ matrix.arch }}-simple-cf-tunnel:${{ steps.version.outputs.version }}
            ghcr.io/znuff/${{ matrix.arch }}-simple-cf-tunnel:latest
          provenance: false
          push: true
